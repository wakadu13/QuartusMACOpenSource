# Builds and tests the application on every push and pull request, then checks the real projects:
# every Quartus project of "projets" and every block of "bibliotheque-EA" is imported and simulated,
# the report is shown in the summary of the run.

name: CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build and test
        run: mvn -B -P no-git-rev -Dgit.commit.id.describe=ci package

      - name: Check the real projects
        run: |
          for d in projets bibliotheque-EA; do
            echo "## $d" >> "$GITHUB_STEP_SUMMARY"
            java -cp target/Digital.jar CLI quartusCheck -dir "$d" -report report.md || status=1
            cat report.md >> "$GITHUB_STEP_SUMMARY"
          done
          exit ${status:-0}
